name: Sync Leetcode

on:
  workflow_dispatch: # Allows you to manually trigger the sync whenever you want
  schedule:
    - cron: "0 8 * * *" # Automatically runs once a week (Every Saturday at 8:00 AM UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-solutions # Name of the folder where your code goes
          verbose: true
          commit-header: "[LeetCode Sync]"
