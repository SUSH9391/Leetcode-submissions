name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Syncs files from LeetCode into a folder named "solutions"
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          destination-folder: solutions

      # Step 2: Check out the repo locally so we can move files around
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      # Step 3: Use Node to group files into folders
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 4: Write and run the file organizer script dynamically
      - name: Organize solutions by topic
        run: |
          cat << 'EOF' > dynamically_organize.js
          const fs = require('fs');
          const path = require('path');

          const destFolder = 'solutions';
          if (!fs.existsSync(destFolder)) {
            console.log("No solutions folder found yet.");
            process.exit(0);
          }

          const files = fs.readdirSync(destFolder);
          
          files.forEach(file => {
            if (file === '.keep') return;
            const filePath = path.join(destFolder, file);
            if (fs.lstatSync(filePath).isDirectory()) return;

            let content = '';
            try { content = fs.readFileSync(filePath, 'utf8'); } catch(e) {}
            
            // Evaluates code contents or file naming conventions to sort them
            let topic = 'Uncategorized';
            const lowerContent = content.toLowerCase();
            const lowerFile = file.toLowerCase();

            if (lowerContent.includes('array') || lowerFile.includes('array')) topic = 'Arrays';
            else if (lowerContent.includes('string') || lowerFile.includes('string')) topic = 'Strings';
            else if (lowerContent.includes('dynamic programming') || lowerContent.includes('dp')) topic = 'Dynamic Programming';
            else if (lowerContent.includes('graph') || lowerContent.includes('dfs') || lowerContent.includes('bfs')) topic = 'Graphs';
            else if (lowerContent.includes('tree') || lowerContent.includes('binary search tree')) topic = 'Trees';
            else if (lowerContent.includes('link') || lowerFile.includes('list')) topic = 'Linked Lists';

            const topicDir = path.join(destFolder, topic);
            if (!fs.existsSync(topicDir)) fs.mkdirSync(topicDir, { recursive: true });

            fs.renameSync(filePath, path.join(topicDir, file));
            console.log(`Moved ${file} to ${topic}`);
          });
          EOF
          node dynamically_organize.js
          rm dynamically_organize.js

      # Step 5: Save and push the clean folder structure to your profile
      - name: Commit organized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Organize solutions by topic"
          git push
