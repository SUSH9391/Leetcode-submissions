name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-solutions
          verbose: true
          commit-header: "[LeetCode Sync]"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Build topic indexes
        run: python scripts/build_leetcode_index.py

      - name: Commit topic indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md leetcode-topics .leetcode-metadata.json leetcode-stats.json
          git diff --cached --quiet || git commit -m "[LeetCode Index] Update topics and stats"
          git push
